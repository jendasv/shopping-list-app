server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    client_max_body_size 20M;

    # Vue SPA built assets — Vite adds content hash, aggressive caching
    location ^~ /assets/ {
        root /var/www/spa;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverb WebSocket — nginx terminates SSL, proxies to reverb:6001
    location ^~ /app {
        proxy_pass         http://reverb:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # Laravel static files published to public/ (Filament assets)
    location ^~ /vendor/ {
        alias /var/www/public/vendor/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Laravel storage (public uploads)
    location ^~ /storage/ {
        alias /var/www/public/storage/;
    }

    # PHP FastCGI handler (used via internal redirect from @laravel)
    location ~ \.php$ {
        root /var/www/public;
        include fastcgi_params;
        fastcgi_pass            php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout    60s;
    }

    # Laravel backend routes
    location ~ ^/(api|sanctum|admin|broadcasting) {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    # Vue SPA — all other routes serve index.html
    location / {
        root /var/www/spa;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
