services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shopping_php
    working_dir: /var/www
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./backend:/var/www
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      # - mysql
      - postgres

  nginx:
    image: nginx:latest
    container_name: shopping_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  postgres:
    image: postgres:17
    container_name: shopping_postgres
    restart: always
    environment:
      POSTGRES_DB: shopping
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh

  adminer:
    image: adminer:latest
    container_name: shopping_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shopping_reverb
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
    volumes:
      - ./backend:/var/www
    ports:
      - "6001:6001"
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      # - mysql
      - postgres

  mailpit:
    image: axllent/mailpit:latest
    container_name: shopping_mailpit
    restart: always
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./docker/certs:/app/certs:ro
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  frontend_node_modules: